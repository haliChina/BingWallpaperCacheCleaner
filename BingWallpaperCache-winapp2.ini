; ---------------------------------------------------------------------------
; Bing Wallpaper (Microsoft Store) - wallpaper image cache
; ---------------------------------------------------------------------------
; Complements "[Microsoft Bing Wallpapers *]" from the upstream winapp2.ini.
; That entry cleans the widget WebView cache
; (BingWallpaper_Widget\1001\EBWebView), AC\ and log folders, but its only
; image rule (FileKey66) targets LocalState\images\bing - a legacy location
; that is empty on current installs. The wallpapers actually live in:
;
;     LocalState\images\$$Content$$   daily UHD images + theme-pack images
;     LocalState\AnimAssets           animated wallpaper scene assets
;     LocalState\images\thumbnails    gallery thumbnails
;
; which are exactly what this entry cleans.
;
; Left out on purpose:
;     LocalState\images\images.db     the app's index (~1.5 MB); deleting it
;                                     buys almost nothing and forces a
;                                     full re-index.
;
; The source file of the current wallpaper is deleted together with the rest
; of $$Content$$; Windows renders from its own transcoded copy and the app
; re-downloads on demand, so this is safe but worth knowing.
; ---------------------------------------------------------------------------

[Microsoft Bing Wallpapers Cache *]
DetectFile=%LocalAppData%\Packages\Microsoft.BingWallpaper_8wekyb3d8bbwe
LangSecRef=3023
FileKey1=%LocalAppData%\Packages\Microsoft.BingWallpaper_8wekyb3d8bbwe\LocalState\images\$$Content$$|*|RECURSE
FileKey2=%LocalAppData%\Packages\Microsoft.BingWallpaper_8wekyb3d8bbwe\LocalState\AnimAssets|*|RECURSE
FileKey3=%LocalAppData%\Packages\Microsoft.BingWallpaper_8wekyb3d8bbwe\LocalState\images\thumbnails|*|RECURSE
